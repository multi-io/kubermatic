stages:
- init
- compile
- test
- release

variables:
  GO_VERSION: "1.14.9"
  KUBERMATIC_EDITION: ee
  GO111MODULE: "on"
  KUBERMATICCOMMIT: "${CI_COMMIT_TAG}"

default:
  image: golang:${GO_VERSION}
  before_script:
  - mkdir -p /go/src/k8c.io
  - cp -r $PWD /go/src/k8c.io/kubermatic
  - cd /go/src/k8c.io/kubermatic
  cache:
    key: go-mod-cache-dir
    paths:
      - /go/pkg/mod
      - vendor

go-mod-vendor:
  stage: init
  script:
  - go mod download
  - go mod vendor
  - cp -r vendor ${CI_PROJECT_DIR}/vendor

build-kubermatic:
  stage: compile
  script:
  - make build
  - cp -r _build ${CI_PROJECT_DIR}/_build
  artifacts:
    paths:
    - _build
    expire_in: '7 days'
  variables:
    GOCACHE: ${CI_PROJECT_DIR}/vendor/cache
  needs: ["go-mod-vendor"]

build-dnatcontroller:
  stage: compile
  script:
  - cd cmd/kubeletdnat-controller
  - go mod vendor
  - make build
  - cp -r _build ${CI_PROJECT_DIR}/cmd/kubeletdnat-controller/_build
  artifacts:
    paths:
      - cmd/kubeletdnat-controller/_build
    expire_in: '7 days'
  needs: ["go-mod-vendor"]

build-nodeport-proxy:
  stage: compile
  script:
    - cd cmd/nodeport-proxy
    - go mod vendor
    - make build
    - cp -r _build ${CI_PROJECT_DIR}/cmd/nodeport-proxy/_build
  artifacts:
    paths:
      - cmd/nodeport-proxy/_build
    expire_in: '7 days'
  needs: ["go-mod-vendor"]

lint-docker:
  stage: test
  image: hadolint/hadolint:latest-debian
  script:
    - hadolint Dockerfile

verify-codegen:
  stage: test
  script:
  - go mod vendor
  - apt-get update && apt-get install -y --no-install-recommends bzr
  - ./hack/verify-codegen.sh
  needs: ["go-mod-vendor"]

lint:
  stage: test
  image: golangci/golangci-lint:v1.30.0
  script:
  - export KUBERMATIC_EDITION=ee
  - make lint
  variables:
    GOLANGCI_LINT_CACHE: ${CI_PROJECT_DIR}/vendor/linter-cache
    GOCACHE: ${CI_PROJECT_DIR}/vendor/cache
  cache:
    key: lintercache
    paths:
      - vendor/linter-cache
      - vendor/cache
  needs: ["go-mod-vendor"]

verify-swagger-spec:
  stage: test
  script:
  - go mod vendor
  - ./hack/verify-swagger.sh
  needs: ["go-mod-vendor"]

test-go:
  stage: test
  script:
  - go mod vendor
  - CGO_ENABLED=1 go test -tags "unit,${KUBERMATIC_EDITION}" -race ./pkg/... ./cmd/... ./codegen/...
  variables:
    GOCACHE: ${CI_PROJECT_DIR}/vendor/cache
  needs: ["go-mod-vendor"]

test-cloud:
  stage: test
  script:
  - go mod vendor
  - go test -tags "cloud ${KUBERMATIC_EDITION}" -run nope ./pkg/test/e2e/api/...
  variables:
    GOCACHE: ${CI_PROJECT_DIR}/vendor/cache
  needs: ["go-mod-vendor"]

test-create:
  stage: test
  script:
  - go mod vendor
  - go test -tags "create ${KUBERMATIC_EDITION}" -run nope ./pkg/test/e2e/api/...
  variables:
    GOCACHE: ${CI_PROJECT_DIR}/vendor/cache
  needs: ["go-mod-vendor"]

test-e2e:
  stage: test
  script:
  - go mod vendor
  - go test -tags "e2e ${KUBERMATIC_EDITION}" -run nope ./pkg/test/e2e/api/...
  variables:
    GOCACHE: ${CI_PROJECT_DIR}/vendor/cache
  needs: ["go-mod-vendor"]

test-integration:
  stage: test
  script:
  - go mod vendor
  - go test -tags "integration,$(KUBERMATIC_EDITION)" -run nope ./pkg/... ./cmd/... ./codegen/...
  variables:
    GOCACHE: ${CI_PROJECT_DIR}/vendor/cache
  needs: ["go-mod-vendor"]

docker-release-kubermatic:
  stage: release
  image: docker:latest
  script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  - docker login -u sys11kubermatic -p $DOCKER_PASSWORD
  - docker build --tag syseleven/kubermatic:$CI_COMMIT_TAG --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG --tag $CI_REGISTRY_IMAGE:latest .
  - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  - docker push $CI_REGISTRY_IMAGE:latest
  - docker push syseleven/kubermatic:$CI_COMMIT_TAG
  dependencies:
  - test-cloud
  - test-create
  - test-e2e
  - test-integration
  - build-kubermatic
  only:
  - tags
  needs:
  - test-cloud
  - test-create
  - test-e2e
  - test-integration
  - verify-swagger-spec
  - verify-codegen
  - build-kubermatic

docker-release-dnatcontroller:
  stage: release
  image: docker:latest
  script:
    - cd cmd/kubeletdnat-controller
    - docker login -u sys11kubermatic -p $DOCKER_PASSWORD
    - docker build --tag syseleven/kubeletdnat-controller:$CI_COMMIT_TAG .
    - docker push syseleven/kubeletdnat-controller:$CI_COMMIT_TAG
  dependencies:
    - test-cloud
    - test-create
    - test-e2e
    - test-integration
    - build-dnatcontroller
  only:
    - tags
  needs:
  - test-cloud
  - test-create
  - test-e2e
  - test-integration
  - verify-swagger-spec
  - verify-codegen
  - build-dnatcontroller

docker-release-etcd-launcher:
  stage: release
  image: docker:latest
  script:
    - docker login -u sys11kubermatic -p $DOCKER_PASSWORD
    - docker build --tag syseleven/etcd-launcher:$CI_COMMIT_TAG -f ./cmd/etcd-launcher/Dockerfile .
    - docker push syseleven/etcd-launcher:$CI_COMMIT_TAG
  dependencies:
    - test-cloud
    - test-create
    - test-e2e
    - test-integration
    - build-kubermatic
  only:
    - tags
  needs:
  - test-cloud
  - test-create
  - test-e2e
  - test-integration
  - verify-swagger-spec
  - verify-codegen
  - build-kubermatic

docker-release-nodeport-proxy:
  stage: release
  image: docker:latest
  script:
    - cd cmd/nodeport-proxy
    - docker login -u sys11kubermatic -p $DOCKER_PASSWORD
    - docker build --tag syseleven/nodeport-proxy:$CI_COMMIT_TAG .
    - docker push syseleven/nodeport-proxy:$CI_COMMIT_TAG
  dependencies:
    - build-nodeport-proxy
  only:
    - tags
  needs:
    - build-nodeport-proxy
